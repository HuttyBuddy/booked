<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Booked PayPal Sandbox Test</title></head>
<body style="font-family:system-ui;max-width:480px;margin:60px auto;padding:0 16px">
<h2>Booked — PayPal Sandbox Test ($89.00)</h2>
<p>Standalone Smart Button test for the Booked hackathon build.</p>
<div id="pp-button"></div>
<div id="result" style="margin-top:20px;font-weight:bold"></div>
<script src="https://www.paypal.com/sdk/js?client-id=AT7yOR9yvELlcU5DOsVOvYwuUaTdMhVm-C1Wqf2t4eCU7j4P9_eNgWnfn3-x_jhCtC8GUTy9siEMpRSf&currency=USD&intent=capture"></script>
<script>
paypal.Buttons({
  createOrder: (data, actions) => actions.order.create({
    purchase_units: [{ amount: { value: "89.00" }, description: "Apex Heating & Air estimate deposit" }]
  }),
  onApprove: (data, actions) => actions.order.capture().then(details => {
    document.getElementById("result").textContent =
      "CAPTURED order " + data.orderID + " payer " + details.payer.name.given_name;
    document.getElementById("result").style.color = "green";
  }),
  onCancel: () => {
    document.getElementById("result").textContent = "cancelled - no charge";
  },
  onError: (err) => {
    document.getElementById("result").textContent = "ERROR: " + err;
    document.getElementById("result").style.color = "red";
  }
}).render("#pp-button");
</script>
</body></html>
